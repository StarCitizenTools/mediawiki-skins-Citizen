name: 🖼 Showcase capture

on:
  schedule:
    # First of the month at 06:00 UTC.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: showcase-capture
  cancel-in-progress: false

jobs:
  capture:
    name: 📸 Capture screenshots
    if: github.repository == 'StarCitizenTools/mediawiki-skins-Citizen'
    runs-on: ubuntu-latest
    # 24 sequential page loads, each capped at 45s of navigation plus 15s of
    # settling. A run that has not finished in this long is stuck, not slow, and
    # the default six-hour cap would hold the concurrency group all day.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Install Chromium
        working-directory: docs
        run: npx playwright install --with-deps chromium

      - name: Setup wrangler
        uses: ./.github/actions/setup-wrangler

      # Objects go up before the PR exists, so the Cloudflare preview on it shows
      # exactly what merging will publish. Keys are content hashes, so uploading
      # ahead of review cannot overwrite anything main still serves.
      - name: Capture and upload
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: mwcitizen-media
        run: node scripts/showcase/capture.js --out ./tmp-shots --upload

      - name: Discard local captures
        working-directory: docs
        run: rm -rf tmp-shots

      # A wiki that refuses keeps the screenshot it already had, so a run where
      # every capture failed still opens a pull request whose diff is nothing
      # but timestamps and whose preview looks entirely correct. The names have
      # to reach the human the pull request is asking to look.
      - name: Compose the pull request body
        id: body
        working-directory: docs
        run: |
          {
            echo "text<<SHOWCASE_BODY"
            printf 'Monthly screenshot refresh. The images are already in R2 under their content hashes, so the Cloudflare preview on this pull request shows exactly what merging will publish.\n\nCheck the preview for captures that caught an error page, a consent banner or a redesign that broke.\n'
            jq -r 'if length > 0 then "\nThese wikis could not be captured, so their cards keep the screenshot from the previous run:\n\n" + (map("- " + .) | join("\n")) else empty end' showcase-failures.json
            echo "SHOWCASE_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Discard the failures scratch file
        working-directory: docs
        run: rm -f showcase-failures.json

      # Using SHOWCASE_PAT when present means ci-docs.yml runs without a manual
      # "Approve and run" click. With GITHUB_TOKEN the run is created but gated.
      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SHOWCASE_PAT || secrets.GITHUB_TOKEN }}
          branch: showcase/capture-refresh
          base: main
          commit-message: "chore(showcase): refresh wiki screenshots"
          title: "chore(showcase): refresh wiki screenshots"
          body: ${{ steps.body.outputs.text }}
          add-paths: docs/data/showcase-shots.json
          delete-branch: true
